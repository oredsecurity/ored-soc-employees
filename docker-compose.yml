# ORED AI SOC Employees - Docker Compose Stack
# https://github.com/oredsecurity/ored-soc-employees
#
# Full-stack mode runs the hardened Wazuh MCP server plus one Hermes SOC agent.
# MCP-only mode runs only the Wazuh MCP server for native/external Hermes clients:
#   docker compose up -d wazuh-mcp-server
#
# For multi-tenant deployments, set COMPOSE_PROJECT_NAME per tenant or use
# scripts/provision-tenant.sh. Do not reintroduce fixed container/network names.

x-security-defaults: &security-defaults
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  wazuh-mcp-server:
    <<: *security-defaults
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - WAZUH_HOST=${WAZUH_HOST}
      - WAZUH_PORT=${WAZUH_PORT:-55000}
      - WAZUH_USER=${WAZUH_USER}
      - WAZUH_PASS=${WAZUH_PASS}
      - WAZUH_VERIFY_SSL=${WAZUH_VERIFY_SSL:-false}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=3000
      - AUTH_MODE=${MCP_AUTH_MODE:-none}
      - AUTH_SECRET_KEY=${MCP_AUTH_SECRET_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ORED_POLL_ENABLED=${ORED_POLL_ENABLED:-true}
      - ORED_POLL_INTERVAL=${ORED_POLL_INTERVAL:-60}
      - ORED_POLL_MIN_LEVEL=${ORED_POLL_MIN_LEVEL:-5}
      - ORED_POLL_BATCH_SIZE=${ORED_POLL_BATCH_SIZE:-100}
      - WAZUH_INDEXER_HOST=${WAZUH_INDEXER_HOST:-}
      - WAZUH_INDEXER_PORT=${WAZUH_INDEXER_PORT:-9200}
      - WAZUH_INDEXER_USER=${WAZUH_INDEXER_USER:-}
      - WAZUH_INDEXER_PASS=${WAZUH_INDEXER_PASS:-}
    volumes:
      - mcp-audit:/var/log/ored-soc
    networks:
      - ored-soc
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    pids_limit: 256
    mem_limit: 512m
    cpus: "0.5"

  hermes-agent:
    <<: *security-defaults
    build:
      context: ./hermes
      dockerfile: Dockerfile
      args:
        HERMES_REF: ${HERMES_REF:-v2026.5.16}
    restart: unless-stopped
    profiles:
      - full
    depends_on:
      wazuh-mcp-server:
        condition: service_healthy
    environment:
      - HOME=/home/hermes
      - HERMES_HOME=/home/hermes/.hermes
      - XDG_CACHE_HOME=/home/hermes/.hermes/cache
      - XDG_STATE_HOME=/home/hermes/.hermes/state
      - XDG_DATA_HOME=/home/hermes/.hermes/share
      - XDG_CONFIG_HOME=/home/hermes/.hermes/config-home
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS:-}
      - MCP_SERVER_URL=http://wazuh-mcp-server:3000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - hermes-data:/home/hermes/.hermes
      - ./hermes/skills:/home/hermes/.hermes/skills/ored-soc:ro
      - ./hermes/plugins:/home/hermes/.hermes/plugins:ro
      - ./hermes/config/config.yaml:/opt/ored/config/config.yaml:ro
      - ./hermes/config/SOUL.md:/home/hermes/.hermes/SOUL.md:ro
    networks:
      - ored-soc
    pids_limit: 512
    mem_limit: 1g
    cpus: "1.0"

networks:
  ored-soc:
    driver: bridge

volumes:
  hermes-data:
  mcp-audit:
